<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ed">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>My Plan · Kapework Create</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/kapework-shell.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <a class="create-link" href="../">← <span>Kapework Create</span></a>
    <button class="brand" id="home-button" aria-label="My Plan home"><span class="brand-mark" aria-hidden="true">✦</span> My Plan</button>
    <div class="header-actions"><button id="library-button" class="quiet">My schedules</button><button id="account-button" class="quiet">Sign in</button><div id="kw-shell-mount"></div></div>
  </header>
  <div class="status-bar"><span class="status-dot" aria-hidden="true"></span><span id="save-status" role="status">Opening your schedules…</span><button class="text-button" id="retry-save" hidden>Retry sync</button></div>
  <div id="notice" class="notice" role="status" hidden></div>
  <main id="app"><div class="loading">A little plan for a lovely day…</div></main>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <dialog id="preview-dialog" class="preview-dialog" aria-labelledby="preview-heading">
    <div class="preview-dialog-bar"><button id="back-to-edit" class="secondary">← Back to editing</button><h2 id="preview-heading">Our schedule</h2></div>
    <div id="phone-preview" class="paper-wrap"></div>
    <div class="preview-actions"><button data-export="pdf" class="primary">Download PDF</button><button data-export="print" class="secondary">Print</button></div>
  </dialog>
  <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
  <input id="photo-input" type="file" accept="image/*" hidden>
  <input id="backup-input" type="file" accept=".myplan,.json,application/json" hidden>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/shared/config.js"></script>
  <script src="/shared/subdomain-nav.js"></script>
  <script src="/shared/kapework-shell.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
